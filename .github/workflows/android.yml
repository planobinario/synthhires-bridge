name: Build Android Bridge

on:
  push:
    paths:
      - 'apps/android-app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Compile and test Android bridge
        run: gradle -p apps/android-app :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Assemble installable edge APK
        run: gradle -p apps/android-app :app:assembleDebug
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthhires-bridge-android
          path: apps/android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish edge APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release_assets
          cp apps/android-app/app/build/outputs/apk/debug/app-debug.apk release_assets/synthhires-bridge-android.apk
          gh release create edge --title "Edge Build" --prerelease --target main || true
          gh release upload edge release_assets/synthhires-bridge-android.apk --clobber
